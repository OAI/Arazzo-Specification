arazzo: 1.2.0
info:
  title: Arazzo Twirp workflow examples
  version: 1.0.0
sourceDescriptions:
  - name: rpcLibrary
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: retrieveBookWithTwirp
    summary: Retrieve a book using Twirp
    inputs:
      type: object
      properties:
        bookId:
          type: string
        bearerToken:
          type: string
      required:
        - bookId
    steps:
      - stepId: getBook
        description: Invoke a unary Protocol Buffer RPC using Twirp
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        rpcProtocol: twirp
        parameters:
          - name: authorization
            in: header
            value: Bearer {$inputs.bearerToken}
        requestBody:
          contentType: application/protobuf
          payload:
            bookId: $inputs.bookId
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          book: $response.body
    outputs:
      book: $steps.getBook.outputs.book

  - workflowId: acceptExpectedTwirpNotFound
    summary: Treat a Twirp not_found error as an expected workflow outcome
    steps:
      - stepId: missingBook
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        rpcProtocol: twirp
        requestBody:
          contentType: application/json
          payload:
            bookId: missing
        successCriteria:
          - condition: $response.status#/code == "not_found"
        outputs:
          errorMessage: $response.status#/msg

arazzo: 1.2.0
info:
  title: UK Open Banking Account Access Authorization (FAPI 1.0 Advanced)
  version: 1.0.0
  description: >
    Demonstrates the redirect interaction pattern in a UK Open Banking / FAPI
    1.0 Advanced context, combining PAR (RFC 9126), JWT Authorization Requests
    (JAR, RFC 9101), and the OpenID Connect hybrid flow.

    The hybrid flow (response_type: code id_token) returns an ID token as a
    detached signature over the authorization response. The ID token carries
    s_hash and c_hash, binding the state and code to the authorization server's
    signature and protecting against authorization response tampering.

    Callback verification is split across two steps:
      1. authorize-with-customer (redirect): captures code, id_token, and state
         from the callback and performs the checks expressible in Arazzo's
         condition language (CSRF state echo, structural presence).
      2. verify-hybrid-response (form): an automated executor step that receives
         the id_token and raw values in context, verifies the JWT signature,
         validates s_hash and c_hash, and returns the confirmed authorization
         code. The inputSchema is the explicit contract for what the executor
         must verify and return.

    Flow:
      PAR push → browser redirect → hybrid callback → JWT verification (automated)
      → token exchange

    Pre-conditions (caller's responsibility before invoking this workflow):
      1. Create an AccountAccessConsent via the ASPSP consent API to obtain
         a consentId (intent ID).
      2. Construct and sign the authorization request JWT (requestJwt) with
         RS256 or PS256, embedding consentId in
         claims.id_token.openbanking_intent_id.value. The JWT MUST include
         response_mode: query — the default hybrid flow response_mode is
         "fragment", which returns parameters in the URL fragment (#) rather
         than the query string. Fragment parameters are browser-side only and
         never forwarded to the executor's callback server, so
         $interaction.payload would be empty without this override.
      3. Sign two client assertion JWTs (clientAssertionPar, clientAssertionToken)
         for private_key_jwt authentication, each with a unique jti.
    JWT signing is outside Arazzo's scope; it is handled by the caller.

sourceDescriptions:
  - name: authServer
    url: ./uk-ob-auth-server.openapi.yaml
    type: openapi

workflows:
  - workflowId: uk-ob-account-access-authorization
    summary: UK Open Banking account access authorization via FAPI 1.0 Advanced hybrid flow
    description: >
      Pushes the signed authorization request to the ASPSP backchannel, redirects
      the customer's browser using only client_id and request_uri, captures the
      hybrid flow callback, then uses an automated form interaction step to verify
      the id_token's s_hash and c_hash before proceeding to token exchange.
    inputs:
      type: object
      required:
        - clientId
        - redirectUri
        - state
        - nonce
        - requestJwt
        - clientAssertionPar
        - clientAssertionToken
      properties:
        clientId:
          type: string
          description: The TPP's OAuth 2.0 client identifier as registered with the ASPSP
        redirectUri:
          type: string
          description: The redirect URI registered for this client
        state:
          type: string
          description: >
            Unguessable random string generated by the TPP for CSRF protection.
            Must match the state embedded in requestJwt.
        nonce:
          type: string
          description: >
            Random string to associate the session with the ID token and
            mitigate replay attacks. Must match the nonce embedded in requestJwt.
        requestJwt:
          type: string
          description: >
            Signed authorization request object (JWS compact serialization,
            RS256 or PS256). Must embed: response_type "code id_token",
            response_mode "query" (required for server-side callback handling —
            see workflow description), scope "openid accounts" (or similar),
            state, nonce, redirect_uri, client_id, and
            claims.id_token.openbanking_intent_id.value set to the consentId
            obtained from the ASPSP consent API.
        clientAssertionPar:
          type: string
          description: >
            Signed JWT client assertion for private_key_jwt authentication
            (RFC 7523) at the /par endpoint. Must have a unique jti to satisfy
            FAPI 1.0 Advanced replay protection requirements.
        clientAssertionToken:
          type: string
          description: >
            Signed JWT client assertion for private_key_jwt authentication
            (RFC 7523) at the /token endpoint. Must have a unique jti distinct
            from clientAssertionPar.
    outputs:
      accessToken: $steps.exchange-code.outputs.accessToken
      idToken:     $steps.exchange-code.outputs.idToken

    steps:

      # Backchannel push — the full signed authorization request is delivered
      # server-to-server. The returned request_uri is used for the browser
      # redirect; sensitive parameters (intent ID, scope, nonce, etc.) never
      # appear in the browser URL.

      - stepId: push-authorization-request
        operationId: $sourceDescriptions.authServer.par
        requestBody:
          contentType: application/x-www-form-urlencoded
          payload:
            client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
            client_assertion: $inputs.clientAssertionPar
            request: $inputs.requestJwt
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          requestUri: $response.body#/request_uri
          expiresIn:  $response.body#/expires_in

      # Hybrid flow redirect:
      # The customer's browser is redirected to /authorize with only client_id
      # and request_uri. The ASPSP authenticates the customer (SCA) and obtains
      # consent confirmation, then redirects back with code, id_token, and state
      # as query parameters (response_mode: query required in requestJwt).
      #
      # successCriteria verify what Arazzo's condition language can express:
      # CSRF state echo and structural presence of code and id_token.
      # Cryptographic verification of s_hash and c_hash is handled by the
      # following verify-hybrid-response step.

      - stepId: authorize-with-customer
        timeout: PT10M
        onTimeout:
          name: auth-timed-out
          type: end
        onCancel:
          name: auth-cancelled
          type: end
        interaction:
          mode: redirect
          prompt: >
            You will be redirected to your bank to authenticate and authorise
            account access. The workflow will resume automatically when you
            are redirected back.
          operationId: $sourceDescriptions.authServer.authorize
          parameters:
            - name: client_id
              in: query
              value: $inputs.clientId
            - name: request_uri
              in: query
              value: $steps.push-authorization-request.outputs.requestUri
          inputSchema:
            type: object
            required:
              - code
              - id_token
              - state
            properties:
              code:
                type: string
                description: Authorization code returned by the ASPSP
              id_token:
                type: string
                description: >
                  Signed ID token (JWS compact serialization) acting as a
                  detached signature over the authorization response. Contains
                  s_hash and c_hash, verified in the next step.
              state:
                type: string
                description: State parameter echoed back by the ASPSP
        successCriteria:
          - condition: $interaction.payload#/state == $inputs.state
          - condition: $interaction.payload#/code != null
          - condition: $interaction.payload#/id_token != null
        onFailure:
          - name: invalid-callback
            type: end
        outputs:
          code:    $interaction.payload#/code
          idToken: $interaction.payload#/id_token
          state:   $interaction.payload#/state

      # Automated verification step:
      # The executor receives the id_token and raw callback values in context
      # and is instructed to verify the JWT signature, validate s_hash and
      # c_hash, and check standard OIDC claims (iss, aud, exp, nonce).
      # The inputSchema is the explicit contract: return the confirmed code
      # and state only if all verification passes.
      #
      # s_hash = BASE64URL(LEFT_HALF(HASH(state)))
      # c_hash = BASE64URL(LEFT_HALF(HASH(code)))
      # where HASH is the algorithm from the id_token's JOSE alg header
      # (RS256/PS256 → SHA-256, RS512 → SHA-512).

      - stepId: verify-hybrid-response
        timeout: PT30S
        onTimeout:
          name: verification-timed-out
          type: end
        interaction:
          mode: form
          prompt: >
            Verify the hybrid flow id_token: validate the JWT signature,
            confirm s_hash matches state, confirm c_hash matches code, and
            validate iss, aud, exp, and nonce claims. Return the confirmed
            authorization code and state only if all checks pass.
          context:
            idToken:          $steps.authorize-with-customer.outputs.idToken
            code:             $steps.authorize-with-customer.outputs.code
            state:            $steps.authorize-with-customer.outputs.state
            expectedState:    $inputs.state
            expectedNonce:    $inputs.nonce
            expectedAudience: $inputs.clientId
          inputSchema:
            type: object
            required:
              - code
              - state
            properties:
              code:
                type: string
                description: >
                  Authorization code, confirmed valid by c_hash verification
                  in the id_token
              state:
                type: string
                description: >
                  State value, confirmed valid by s_hash verification in
                  the id_token
              sub:
                type: string
                description: Subject identifier from the verified id_token
        successCriteria:
          - condition: $interaction.payload#/code != null
          - condition: $interaction.payload#/state == $inputs.state
        onFailure:
          - name: verification-failed
            type: end
        outputs:
          code: $interaction.payload#/code
          sub:  $interaction.payload#/sub

      - stepId: exchange-code
        operationId: $sourceDescriptions.authServer.token
        requestBody:
          contentType: application/x-www-form-urlencoded
          payload:
            grant_type:             authorization_code
            code:                   $steps.verify-hybrid-response.outputs.code
            redirect_uri:           $inputs.redirectUri
            client_id:              $inputs.clientId
            client_assertion_type:  urn:ietf:params:oauth:client-assertion-type:jwt-bearer
            client_assertion:       $inputs.clientAssertionToken
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: tokens-obtained
            type: end
        outputs:
          accessToken: $response.body#/access_token
          idToken:     $response.body#/id_token
          expiresIn:   $response.body#/expires_in

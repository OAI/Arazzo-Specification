arazzo: 1.2.0
info:
  title: Arazzo gRPC-Web workflow examples
  version: 1.0.0
sourceDescriptions:
  - name: rpcLibrary
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: retrieveBookWithGrpcWeb
    summary: Retrieve a book using a unary gRPC-Web RPC
    inputs:
      type: object
      properties:
        bookId:
          type: string
        bearerToken:
          type: string
      required:
        - bookId
    steps:
      - stepId: getBook
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        rpcProtocol: grpc-web
        parameters:
          - name: authorization
            in: metadata
            value: Bearer {$inputs.bearerToken}
        requestBody:
          contentType: application/grpc-web+proto
          payload:
            bookId: $inputs.bookId
        successCriteria:
          - condition: $response.status#/code == 0
        outputs:
          book: $response.body
          requestId: $response.metadata.x-request-id

  - workflowId: watchBooksWithGrpcWeb
    summary: Receive book updates using gRPC-Web server streaming
    steps:
      - stepId: watchBooks
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/WatchBooks
        rpcProtocol: grpc-web
        timeout: 30000
        requestBody:
          contentType: application/grpc-web-text+proto
          payload:
            category: architecture
        successCriteria:
          - condition: $response.status#/code == 0
        outputs:
          updates: $response.body
          traceId: $response.trailingMetadata.trace-id

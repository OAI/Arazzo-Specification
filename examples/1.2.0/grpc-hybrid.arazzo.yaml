arazzo: 1.2.0
info:
  title: Hybrid OpenAPI and gRPC workflow
  version: 1.0.0
sourceDescriptions:
  - name: petStore
    type: openapi
    url: ../1.0.0/pet-coupons.openapi.yaml
  - name: grpcLibrary
    type: protobuf
    url: ./grpc-library.proto
workflows:
  - workflowId: inspectAndUpload
    inputs:
      type: object
      properties:
        petId:
          type: integer
        uploadId:
          type: string
      required:
        - petId
        - uploadId
    steps:
      - stepId: getPet
        operationId: $sourceDescriptions.petStore.getPetById
        parameters:
          - name: petId
            in: path
            value: $inputs.petId
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          petId: $response.body#/id
      - stepId: uploadPetRecord
        grpcMethod: $sourceDescriptions.grpcLibrary.org.v1.Library/UploadChunks
        parameters:
          - name: x-workflow-token
            in: metadata
            value: workflow-token
        requestBody:
          - payload:
              uploadId: $inputs.uploadId
              sequence: $steps.getPet.outputs.petId
              data: UGV0
        successCriteria:
          - condition: $response.status#/code == 0
        outputs:
          uploadId: $response.body#/uploadId

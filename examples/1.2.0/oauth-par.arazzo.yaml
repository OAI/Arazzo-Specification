arazzo: 1.2.0
info:
  title: OAuth 2.0 Authorization Code Flow with PAR (FAPI 2.0)
  version: 1.0.0
  description: >
    Demonstrates the redirect interaction pattern combined with a preceding
    API operation step, using Pushed Authorization Requests (RFC 9126) and
    JWT Authorization Requests (JAR, RFC 9101) as required by the FAPI 2.0
    Security Profile.

    PAR pushes the full authorization request to the authorization server
    backchannel as a signed JWT (`request` JWS), before the browser redirect.
    Sensitive parameters (scope, state, PKCE challenge, etc.) are delivered
    server-to-server and never appear in the browser URL or server access logs.
    The redirect step exposes only `client_id` and the opaque `request_uri`
    returned by /par.

    Client authentication uses `private_key_jwt` (RFC 7523) at both /par and
    /token. PKCE is mandatory with S256 (FAPI 2.0 mandate).

    Flow: PAR push (operation step) → browser redirect (interaction step) → token exchange (operation step)

    Note: JWT signing (producing the `request` JWS, `clientAssertionPar`, and
    `clientAssertionToken`) is performed by the caller before invoking this
    workflow. Each client assertion MUST have a unique jti (FAPI 2.0 replay
    protection). Arazzo describes the orchestration; cryptographic operations
    are handled by the executor.

sourceDescriptions:
  - name: authServer
    url: ./oauth-as.openapi.yaml
    type: openapi

workflows:
  - workflowId: obtain-access-token-par
    summary: Obtain an access token using authorization code flow with PAR (FAPI 2.0)
    description: >
      Pushes the signed authorization request to the AS backchannel, redirects
      the actor's browser using only client_id and request_uri, validates the
      returned state parameter to prevent CSRF, then exchanges the authorization
      code for an access token using private_key_jwt client authentication.
    inputs:
      type: object
      required:
        - clientId
        - redirectUri
        - state
        - codeVerifier
        - requestJwt
        - clientAssertionPar
        - clientAssertionToken
      properties:
        clientId:
          type: string
          description: The OAuth 2.0 client identifier
        redirectUri:
          type: string
          description: The URI the authorization server redirects back to
        state:
          type: string
          description: >
            Unguessable random string generated by the caller for CSRF
            protection. Must match the state embedded in requestJwt.
        codeVerifier:
          type: string
          description: >
            PKCE code verifier (RFC 7636). The corresponding code_challenge
            (S256 hash) must be embedded in requestJwt.
        requestJwt:
          type: string
          description: >
            Signed JWT authorization request object (JWS compact serialization,
            RS256 or PS256). Contains response_type, client_id, redirect_uri,
            scope, state, nonce, code_challenge, code_challenge_method, and
            standard JWT claims (iss, aud, exp, nbf).
        clientAssertionPar:
          type: string
          description: >
            Signed JWT client assertion for private_key_jwt authentication
            (RFC 7523) at the /par endpoint. Must have a unique jti to satisfy
            FAPI 2.0 replay protection requirements.
        clientAssertionToken:
          type: string
          description: >
            Signed JWT client assertion for private_key_jwt authentication
            (RFC 7523) at the /token endpoint. Must have a unique jti distinct
            from clientAssertionPar.

    steps:

      # Backchannel push — all authorization parameters are delivered inside the
      # signed request JWT, server-to-server. The returned request_uri is an
      # opaque handle; the browser redirect uses only client_id + request_uri.

      - stepId: push-authorization-request
        operationId: $sourceDescriptions.authServer.par
        requestBody:
          contentType: application/x-www-form-urlencoded
          payload:
            client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
            client_assertion: $inputs.clientAssertionPar
            request: $inputs.requestJwt
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          requestUri: $response.body#/request_uri
          expiresIn:  $response.body#/expires_in

      # Out-of-band redirect with PAR:
      # The actor's browser is redirected to /authorize with only client_id and
      # request_uri. All authorization parameters were already bound on the AS
      # side. Workflow execution suspends here and resumes automatically when
      # the AS redirects back to the executor's callback URL with ?code=&state=
      # The executor extracts the callback data, validates it against inputSchema,
      # and makes the result accessible as $interaction.payload.

      - stepId: authorize-with-provider
        interaction:
          mode: redirect
          prompt: >
            You will be redirected to the authorization server to authenticate
            and grant access. The workflow will resume automatically when you
            are redirected back.
          operationId: $sourceDescriptions.authServer.authorize
          parameters:
            - name: client_id
              in: query
              value: $inputs.clientId
            - name: request_uri
              in: query
              value: $steps.push-authorization-request.outputs.requestUri
          inputSchema:
            type: object
            required:
              - code
              - state
            properties:
              code:
                type: string
                description: Authorization code returned by the authorization server
              state:
                type: string
                description: State parameter echoed back; MUST match the value sent
        timeout: PT5M
        onTimeout:
          name: auth-timed-out
          type: end
        onCancel:
          name: auth-cancelled
          type: end                
        successCriteria:
          # Validate the state parameter to prevent CSRF
          - condition: $interaction.payload#/state == $inputs.state
        onFailure:
          - name: state-mismatch
            type: end
        outputs:
          code: $interaction.payload#/code

      - stepId: exchange-code
        operationId: $sourceDescriptions.authServer.token
        requestBody:
          contentType: application/x-www-form-urlencoded
          payload:
            grant_type:             authorization_code
            code:                   $steps.authorize-with-provider.outputs.code
            redirect_uri:           $inputs.redirectUri
            client_id:              $inputs.clientId
            client_assertion_type:  urn:ietf:params:oauth:client-assertion-type:jwt-bearer
            client_assertion:       $inputs.clientAssertionToken
            code_verifier:          $inputs.codeVerifier
        successCriteria:
          - condition: $statusCode == 200
        onSuccess:
          - name: token-obtained
            type: end
        outputs:
          accessToken: $response.body#/access_token
          tokenType:   $response.body#/token_type
          expiresIn:   $response.body#/expires_in

    outputs:
      accessToken: $steps.exchange-code.outputs.accessToken
      tokenType:   $steps.exchange-code.outputs.tokenType          

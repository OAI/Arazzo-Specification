arazzo: 1.2.0
info:
  title: Arazzo Connect RPC workflow examples
  version: 1.0.0
sourceDescriptions:
  - name: rpcLibrary
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: retrieveBookWithConnect
    summary: Retrieve a book using a unary Connect RPC
    inputs:
      type: object
      properties:
        bookId:
          type: string
        bearerToken:
          type: string
      required:
        - bookId
    steps:
      - stepId: getBook
        type: rpc
        method: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        protocol: connect
        parameters:
          - name: authorization
            in: metadata
            value: Bearer {$inputs.bearerToken}
        requestBody:
          contentType: application/json
          payload:
            bookId: $inputs.bookId
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          book: $response.body
          requestId: $response.metadata.x-request-id
    outputs:
      book: $steps.getBook.outputs.book

  - workflowId: uploadWithConnect
    summary: Upload an authored stream using Connect RPC
    steps:
      - stepId: uploadChunks
        type: rpc
        method: $sourceDescriptions.rpcLibrary.org.v1.Library/UploadChunks
        protocol: connect
        requestBody:
          - contentType: application/connect+proto
            payload:
              uploadId: upload-123
              sequence: 1
              data: YQ==
          - contentType: application/connect+proto
            payload:
              uploadId: upload-123
              sequence: 2
              data: Yg==
        successCriteria:
          - condition: $response.body#/chunksReceived == 2
        outputs:
          chunksReceived: $response.body#/chunksReceived
          operationCost: $response.trailingMetadata.operation-cost

  - workflowId: acceptExpectedConnectError
    summary: Treat a Connect not_found error as an expected workflow outcome
    steps:
      - stepId: missingBook
        type: rpc
        method: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        protocol: connect
        requestBody:
          contentType: application/proto
          payload:
            bookId: missing
        successCriteria:
          - condition: $response.status#/code == 'not_found'
        outputs:
          errorMessage: $response.status#/message

  - workflowId: acceptExpectedConnectStreamError
    summary: Accept a terminal not_found error when the requested category does not exist
    steps:
      - stepId: watchMissingCategory
        type: rpc
        method: org.v1.Library/WatchBooks
        protocol: connect
        timeout: 30000
        requestBody:
          contentType: application/connect+proto
          payload:
            category: missing-category
        successCriteria:
          - condition: $response.status#/code == 'not_found'
        outputs:
          updates: $response.body
          errorMessage: $response.status#/message

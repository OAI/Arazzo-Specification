arazzo: 1.2.0
info:
  title: Invalid gRPC Step channelPath
  version: 1.0.0
sourceDescriptions:
  - name: rpcLibrary
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: invalid
    steps:
      - stepId: getBook
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        rpcProtocol: grpc
        # Invalid: a gRPC Step cannot use AsyncAPI channelPath or action fields.
        channelPath: orders
        action: receive

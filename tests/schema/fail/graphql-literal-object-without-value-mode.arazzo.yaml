arazzo: 1.2.0
info:
  title: GraphQL literal object without value mode
  version: 1.0.0
sourceDescriptions:
  - name: shopSchema
    type: graphql
    url: ./schema.graphqls
workflows:
  - workflowId: updateBook
    steps:
      - stepId: updateBook
        graphqlOperation:
          schema: $sourceDescriptions.shopSchema
          operation: 'mutation UpdateBook($input: BookInput!) { updateBook(input: $input) { id } }'
        parameters:
          - name: input
            in: variable
            value:
              bookId: book-123

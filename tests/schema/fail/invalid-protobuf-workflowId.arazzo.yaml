arazzo: 1.2.0
info:
  title: Invalid gRPC Step workflowId
  version: 1.0.0
sourceDescriptions:
  - name: rpcLibrary
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: invalid
    steps:
      - stepId: getBook
        type: rpc
        method: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        protocol: grpc
        # Invalid: method and workflowId are mutually exclusive.
        workflowId: anotherWorkflow

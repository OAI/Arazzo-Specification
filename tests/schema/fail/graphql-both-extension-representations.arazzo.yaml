arazzo: 1.2.0
info:
  title: GraphQL extensions representations are mutually exclusive
  version: 1.0.0
sourceDescriptions:
  - name: shopSchema
    type: graphql
    url: ./schema.graphqls
workflows:
  - workflowId: lookupBook
    steps:
      - stepId: getBook
        graphqlOperation:
          schema: $sourceDescriptions.shopSchema
          operation: 'query GetBook { book { id } }'
          extensions:
            tracing: enabled
          extensionsSelector:
            context: $inputs.request
            selector: $.extensions
            type: jsonpath

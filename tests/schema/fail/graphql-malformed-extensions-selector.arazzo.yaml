arazzo: 1.2.0
info:
  title: GraphQL extensions selector must be valid
  version: 1.0.0
sourceDescriptions:
  - name: shopSchema
    type: graphql
    url: ./schema.graphqls
workflows:
  - workflowId: lookupBook
    steps:
      - stepId: getBook
        type: graphql
        operation:
          schema: $sourceDescriptions.shopSchema
          document: 'query GetBook { book { id } }'
          extensionsSelector:
            context: $inputs.request
            selector: $.extensions

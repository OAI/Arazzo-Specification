arazzo: 1.2.0
info:
  title: Invalid gRPC Step selector conflict
  version: 1.0.0
sourceDescriptions:
  - name: rpcLibrary
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: invalid
    steps:
      - stepId: getBook
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        rpcProtocol: grpc
        # Invalid: rpcMethod is mutually exclusive with operationId.
        operationId: getBook

arazzo: 1.2.0
info:
  title: gRPC step with an invalid header parameter
  version: 1.0.0
sourceDescriptions:
  - name: library
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: lookupBook
    steps:
      - stepId: getBook
        type: rpc
        rpcMethod: $sourceDescriptions.library.org.v1.Library/GetBook
        rpcProtocol: grpc
        parameters:
          - name: authorization
            in: header
            value: Bearer example-token

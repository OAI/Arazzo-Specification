arazzo: 1.2.0
info:
  title: Redirect mode interaction with both operationPath and url (mutually exclusive)
  version: 1.0.0
sourceDescriptions:
  - name: authServer
    url: https://auth.example.com/openapi.yaml
    type: openapi
workflows:
  - workflowId: oauthFlow
    steps:
      - stepId: authorize
        interaction:
          mode: redirect
          prompt: "Please authorize."
          operationPath: "$sourceDescriptions.authServer#/paths/~1authorize/get"
          url: https://auth.example.com/authorize

arazzo: 1.2.0
info:
  title: Redirect mode interaction without operationId, operationPath, or url
  version: 1.0.0
sourceDescriptions:
  - name: authServer
    url: https://auth.example.com/openapi.yaml
    type: openapi
workflows:
  - workflowId: oauthFlow
    steps:
      - stepId: authorize
        interaction:
          mode: redirect
          prompt: "Please authorize."
          inputSchema:
            type: object
            properties:
              code:
                type: string

arazzo: 1.2.0
info:
  title: Twirp RPC Step
  version: 1.0.0
sourceDescriptions:
  - name: rpcLibrary
    type: protobuf
    url: ./rpc-library.proto
workflows:
  - workflowId: getBookWithTwirp
    steps:
      - stepId: getBook
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        rpcProtocol: twirp
        parameters:
          - name: authorization
            in: header
            value: Bearer {$inputs.token}
        requestBody:
          contentType: application/protobuf
          payload:
            bookId: "123"
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          title: $response.body#/title

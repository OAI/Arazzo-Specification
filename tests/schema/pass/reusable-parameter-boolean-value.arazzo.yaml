arazzo: 1.1.0
info:
  title: Reusable parameters accept boolean values
  version: 1.0.0
sourceDescriptions:
  - name: api
    url: https://example.com/openapi.yaml
    type: openapi
  - name: events
    url: https://example.com/asyncapi.yaml
    type: asyncapi
components:
  parameters:
    operationValue:
      name: value
      in: header
      value: true
    workflowValue:
      name: value
      value: true
workflows:
  - workflowId: parent
    parameters:
      - reference: $components.parameters.operationValue
        value: false
    steps:
      - stepId: openapi
        operationId: $sourceDescriptions.api.send
        parameters:
          - reference: $components.parameters.operationValue
            value: false
      - stepId: asyncapi
        operationId: $sourceDescriptions.events.send
        action: send
        parameters:
          - reference: $components.parameters.operationValue
            value: false
      - stepId: workflow
        workflowId: child
        parameters:
          - reference: $components.parameters.workflowValue
            value: false
  - workflowId: child
    inputs:
      type: object
      properties:
        value: {}
    steps:
      - stepId: send
        operationId: $sourceDescriptions.api.send

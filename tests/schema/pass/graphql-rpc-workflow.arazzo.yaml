arazzo: 1.2.0
info:
  title: GraphQL and gRPC in one workflow
  version: 1.0.0
sourceDescriptions:
  - name: shopSchema
    type: graphql
    url: ../../../examples/1.2.0/schema.graphqls
  - name: rpcLibrary
    type: protobuf
    url: ../../../examples/1.2.0/rpc-library.proto
workflows:
  - workflowId: lookUpBook
    steps:
      - stepId: findBook
        graphqlOperation:
          schema: $sourceDescriptions.shopSchema
          operation: 'query GetBook($id: ID!) { book(id: $id) { id } }'
        parameters:
          - name: id
            in: variable
            value: book-123
        outputs:
          bookId: $response.body#/data/book/id
      - stepId: getBook
        rpcProtocol: grpc
        rpcMethod: $sourceDescriptions.rpcLibrary.org.v1.Library/GetBook
        parameters:
          - name: x-request-id
            in: metadata
            value: book-lookup
        requestBody:
          payload:
            bookId: $steps.findBook.outputs.bookId

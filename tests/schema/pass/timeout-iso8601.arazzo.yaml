arazzo: 1.2.0
info:
  title: ISO 8601 duration string for timeout on various step types
  version: 1.0.0
sourceDescriptions:
  - name: userAPI
    url: https://users.com/openapi.yaml
    type: openapi
workflows:
  - workflowId: timeoutWorkflow
    steps:
      - stepId: api-step-with-iso-timeout
        operationId: $sourceDescriptions.userAPI.getUser
        timeout: PT30S
      - stepId: api-step-with-longer-timeout
        operationId: $sourceDescriptions.userAPI.getUser
        timeout: PT8H
      - stepId: interaction-step-with-iso-timeout
        timeout: P2D
        interaction:
          prompt: "Please review within 2 days."
          inputSchema:
            type: object
            required: [approved]
            properties:
              approved:
                type: boolean
